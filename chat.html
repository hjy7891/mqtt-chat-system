<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>内部专用聊天系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f3f4f6; max-width: 480px; margin: 0 auto; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .chat-container { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: calc(100vh - 32px); overflow: hidden; }
    .chat-header { padding: 12px 16px; background: #2563eb; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .chat-header h1 { font-size: 16px; font-weight: 600; }
    .online-count { font-size: 14px; }
    .online-count span { font-weight: 700; }
    .user-input { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; }
    .user-input input { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    .msg-box { flex: 1; padding: 16px; overflow-y: auto; background: #f9fafb; display: flex; flex-direction: column; gap: 12px; }
    .msg-box::-webkit-scrollbar { width: 4px; }
    .msg-box::-webkit-scrollbar-track { background: #e5e7eb; }
    .msg-box::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 2px; }
    .msg-row { display: flex; }
    .msg-row.right { justify-content: flex-end; }
    .msg-bubble { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .msg-row.right .msg-bubble { background: #dcfce7; border-bottom-right-radius: 2px; }
    .msg-row.left .msg-bubble { background: #fff; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .msg-user { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #374151; }
    .sys-msg { text-align: center; font-size: 12px; color: #6b7280; margin: 8px 0; }
    .sys-msg.error { color: #dc2626; }
    .sys-msg.success { color: #16a34a; }
    .input-area { padding: 12px 16px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; align-items: center; }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-send { background: #22c55e; color: #fff; font-weight: 500; }
    .status-bar { padding: 4px 16px; background: #f3f4f6; font-size: 10px; color: #6b7280; text-align: center; }
    .room-input { padding: 8px 16px; background: #eff6ff; display: flex; gap: 8px; align-items: center; }
    .room-input input { flex: 1; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    .room-input label { font-size: 12px; color: #1d4ed8; font-weight: 600; white-space: nowrap; }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <h1>📩 内部聊天系统</h1>
    <div class="online-count">在线: <span id="online">0</span> 人</div>
  </div>
  <div class="room-input">
    <label>房间:</label>
    <input id="room" value="default" />
  </div>
  <div class="user-input">
    <input id="user" placeholder="输入你的昵称" />
  </div>
  <div id="msgBox" class="msg-box"></div>
  <div class="status-bar" id="statusBar">正在连接...</div>
  <div class="input-area">
    <input id="msg" placeholder="输入消息..." />
    <button class="btn btn-send" onclick="send()">发送</button>
  </div>
</div>

<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<script>
let client = null;
let reconnectAttempts = 0;

// 公共 MQTT Broker（免费，无需注册）
const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';

function getRoom() {
  return document.getElementById('room').value.trim() || 'default';
}

function getTopics() {
  const room = getRoom();
  return {
    chat: `chat_${room}/message`,
    online: `chat_${room}/online`,
    join: `chat_${room}/join`,
    leave: `chat_${room}/leave`
  };
}

function updateStatus(text, type) {
  const bar = document.getElementById('statusBar');
  bar.textContent = text;
  bar.className = 'status-bar';
  if (type) bar.classList.add(type);
}

function updateOnline(count) {
  document.getElementById('online').textContent = count;
}

window.onload = () => {
  loadHistory();
  connect();

  document.getElementById('msg').addEventListener('keydown', e => e.key === 'Enter' && send());
  document.getElementById('room').addEventListener('change', () => {
    if (client) {
      const topics = getTopics();
      client.unsubscribe(`chat_${getRoom()}/#`);
      connect();
    }
  });
};

function connect() {
  if (client) {
    client.end(true);
    client = null;
  }

  const topics = getTopics();
  updateStatus('连接中...');

  const clientId = 'chat_' + Math.random().toString(16).substr(2, 8);

  const options = {
    clientId: clientId,
    clean: true,
    connectTimeout: 5000,
    reconnectPeriod: 3000,
  };

  try {
    client = mqtt.connect(BROKER_URL, options);

    client.on('connect', () => {
      sysMsg('已连接到聊天服务器', 'success');
      updateStatus('已连接', 'success');
      reconnectAttempts = 0;

      client.subscribe([topics.chat, topics.online, topics.join, topics.leave], (err) => {
        if (err) {
          sysMsg('订阅失败: ' + err.message, 'error');
        } else {
          const user = document.getElementById('user').value.trim() || '匿名用户';
          client.publish(topics.join, JSON.stringify({ user: user, id: clientId }));
        }
      });
    });

    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());

        if (topic === topics.chat) {
          showMsg(data);
          saveHistory(data);
        } else if (topic === topics.online) {
          updateOnline(data.count);
        } else if (topic === topics.join) {
          if (data.id !== clientId) {
            sysMsg(data.user + ' 加入了聊天', 'success');
          }
        } else if (topic === topics.leave) {
          sysMsg(data.user + ' 离开了聊天');
        }
      } catch (e) {
        console.error('Parse error:', e);
      }
    });

    client.on('error', (err) => {
      sysMsg('连接错误: ' + err.message, 'error');
      updateStatus('连接错误', 'error');
    });

    client.on('close', () => {
      updateStatus('连接断开，重连中...');
      reconnectAttempts++;
    });

    client.on('reconnect', () => {
      updateStatus('重新连接中...');
    });

  } catch (e) {
    sysMsg('初始化失败: ' + e.message, 'error');
    updateStatus('初始化失败', 'error');
  }
}

function send() {
  const user = document.getElementById('user').value.trim();
  const msg = document.getElementById('msg').value.trim();

  if (!user) {
    alert('请输入昵称！');
    return;
  }
  if (!msg) return;
  if (!client || !client.connected) {
    sysMsg('未连接，请等待重新连接', 'error');
    return;
  }

  const topics = getTopics();
  const message = {
    user: user,
    msg: msg,
    time: new Date().toLocaleTimeString()
  };

  client.publish(topics.chat, JSON.stringify(message));
  showMsg(message);
  saveHistory(message);
  document.getElementById('msg').value = '';
}

function showMsg(data) {
  const isMe = data.user === document.getElementById('user').value;
  const div = document.createElement('div');
  div.className = 'msg-row ' + (isMe ? 'right' : 'left');

  const safeUser = escapeHtml(data.user);
  const safeMsg = escapeHtml(data.msg);
  const safeTime = escapeHtml(data.time || '');

  div.innerHTML = '<div class="msg-bubble"><div class="msg-user">' + safeUser + ' ' + safeTime + '</div><div>' + safeMsg + '</div></div>';

  document.getElementById('msgBox').appendChild(div);
  document.getElementById('msgBox').scrollTop = document.getElementById('msgBox').scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function sysMsg(text, type) {
  const d = document.createElement('div');
  d.className = 'sys-msg' + (type ? ' ' + type : '');
  d.textContent = text;
  document.getElementById('msgBox').appendChild(d);
  document.getElementById('msgBox').scrollTop = document.getElementById('msgBox').scrollHeight;
}

function saveHistory(data) {
  let h = JSON.parse(localStorage.getItem('chatHistory') || '[]');
  h.push(data);
  localStorage.setItem('chatHistory', JSON.stringify(h.slice(-200)));
}

function loadHistory() {
  let h = JSON.parse(localStorage.getItem('chatHistory') || '[]');
  h.forEach(showMsg);
}

window.addEventListener('beforeunload', () => {
  if (client && client.connected) {
    const user = document.getElementById('user').value.trim() || '匿名用户';
    const topics = getTopics();
    client.publish(topics.leave, JSON.stringify({ user: user, id: clientId }));
    client.end();
  }
});
</script>
</body>
</html>
