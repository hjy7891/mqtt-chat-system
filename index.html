<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>内部聊天系统</title>
  <style>
    /* 响应式字体基础：使用 clamp() 实现根字体随视口平滑缩放 */
    html { font-size: clamp(14px, 1.5vw, 18px); }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f3f4f6; max-width: 100%; width: 100%; margin: 0 auto; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; min-height: 100vh; }
    .page { display: none; }
    .page.active { display: block; }
    
    /* 响应式容器 */
    .auth-container, .main-container, .chat-container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    /* 大屏适配 */
    @media (min-width: 768px) {
      body { padding: 20px; }
      .auth-container { margin-top: 60px; max-width: 500px; }
      .main-container, .chat-container { min-height: calc(100vh - 40px); }
    }
    
    /* 小屏适配：针对移动端优化字体和尺寸 */
    @media (max-width: 767px) {
      body { padding: 0; }
      .auth-container { margin: 20px 16px; padding: 24px 16px; }
      .main-container, .chat-container { border-radius: 0; min-height: 100vh; }
      
      /* 移动端响应式字体 */
      .auth-title { font-size: clamp(20px, 5vw, 24px); }
      .auth-subtitle { font-size: clamp(12px, 3vw, 14px); }
      .auth-input { font-size: clamp(14px, 3.5vw, 16px); padding: 10px 14px; }
      .auth-btn { font-size: clamp(14px, 3.5vw, 16px); padding: 10px; }
      .room-name { font-size: clamp(14px, 3.5vw, 16px); }
      .room-desc { font-size: clamp(12px, 3vw, 13px); }
      .chat-header h1 { font-size: clamp(14px, 4vw, 16px); }
      .msg-bubble { font-size: clamp(14px, 3.8vw, 16px); }
      .msg-user { font-size: clamp(11px, 2.8vw, 12px); }
      .input-area input[type="text"] { font-size: clamp(14px, 3.5vw, 16px); }
      .btn { font-size: clamp(14px, 3.5vw, 16px); padding: 10px 16px; }
      .modal h2 { font-size: clamp(16px, 4.5vw, 18px); }
      .modal p { font-size: clamp(12px, 3vw, 14px); }
      .online-count { font-size: clamp(12px, 3vw, 13px); }
      .back-btn, .invite-btn { font-size: clamp(11px, 2.8vw, 13px); padding: 4px 8px; }
    }
    
    /* 登录/注册样式 */
    .auth-container { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 32px; margin-top: 40px; }
    .auth-title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; color: #1f2937; }
    .auth-subtitle { text-align: center; color: #6b7280; margin-bottom: 24px; font-size: 14px; }
    .auth-tabs { display: flex; border-bottom: 2px solid #e5e7eb; margin-bottom: 24px; }
    .auth-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 14px; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .auth-tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }
    .auth-input { width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    .auth-input:focus { outline: none; border-color: #2563eb; }
    .auth-btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .auth-btn:hover { opacity: 0.9; }
    .auth-error { color: #dc2626; font-size: 13px; margin-bottom: 16px; text-align: center; }
    
    /* 主界面样式 */
    .main-container { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-height: 100vh; overflow: hidden; }
    
    /* 大屏主界面样式 */
    @media (min-width: 768px) {
      .main-container { min-height: calc(100vh - 40px); margin-top: 20px; }
    }
    .main-header { padding: 16px; background: #2563eb; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .main-header h1 { font-size: 18px; font-weight: 600; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .user-avatar { width: 32px; height: 32px; background: #fff; color: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
    .logout-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .logout-btn:hover { background: rgba(255,255,255,0.3); }
    .room-create { padding: 16px; border-bottom: 1px solid #e5e7eb; }
    .room-create-form { display: flex; gap: 8px; }
    .room-create input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    .room-create button { padding: 10px 20px; background: #22c55e; color: #fff; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; }
    .room-list { padding: 8px 0; }
    .room-item { padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #f3f4f6; }
    .room-item:hover { background: #f9fafb; }
    .room-icon { width: 40px; height: 40px; background: #dbeafe; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .room-info { flex: 1; }
    .room-name { font-weight: 600; font-size: 15px; color: #1f2937; }
    .room-desc { font-size: 13px; color: #6b7280; margin-top: 2px; }
    .room-join-btn { padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state-text { font-size: 14px; }
    
    /* 聊天室样式 */
    .chat-container { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* 大屏聊天室样式 */
    @media (min-width: 768px) {
      .chat-container { height: calc(100vh - 40px); margin-top: 20px; }
      .msg-bubble { max-width: 60%; }
    }
    .chat-header { padding: 12px 16px; background: #2563eb; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .chat-header-left { display: flex; align-items: center; gap: 8px; }
    .back-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .chat-header h1 { font-size: 16px; font-weight: 600; }
    .chat-actions { display: flex; gap: 8px; }
    .invite-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .online-count { font-size: 13px; position: relative; cursor: pointer; }
    .online-count span { font-weight: 700; }
    .online-count .divider { color: #fff; opacity: 0.7; margin: 0 4px; }
    .user-list-popup {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      min-width: 200px;
      max-width: 260px;
      padding: 8px 0;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
      pointer-events: none;
    }
    .online-count:hover .user-list-popup {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }
    .user-list-popup::before {
      content: '';
      position: absolute;
      top: -6px;
      right: 20px;
      width: 12px;
      height: 12px;
      background: #fff;
      transform: rotate(45deg);
      box-shadow: -2px -2px 5px rgba(0,0,0,0.05);
    }
    .user-list-header {
      padding: 10px 16px 8px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f3f4f6;
    }
    .user-list-header .count {
      font-size: 12px;
      color: #6b7280;
      font-weight: normal;
    }
    .user-list-section {
      padding: 8px 0 4px;
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .user-list-section.online { padding-left: 16px; padding-right: 16px; }
    .user-list-section.all { padding-left: 16px; padding-right: 16px; }
    .user-list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      font-size: 14px;
      color: #1f2937;
      transition: background 0.15s ease;
    }
    .user-list-item:hover { background: #f9fafb; }
    .user-list-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }
    .user-list-item.online .user-list-avatar { background: #22c55e; }
    .user-list-item.offline .user-list-avatar { background: #9ca3af; }
    .user-list-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .user-list-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .user-list-status.online { background: #22c55e; box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2); }
    .user-list-status.offline { background: #d1d5db; }
    .user-list-empty {
      padding: 16px;
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
    }
    .msg-box { flex: 1; padding: 16px; overflow-y: auto; background: #f9fafb; display: flex; flex-direction: column; gap: 12px; }
    .msg-box::-webkit-scrollbar { width: 4px; }
    .msg-box::-webkit-scrollbar-track { background: #e5e7eb; }
    .msg-box::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 2px; }
    .msg-row { display: flex; }
    .msg-row.right { justify-content: flex-end; }
    .msg-bubble { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .msg-row.right .msg-bubble { background: #dcfce7; border-bottom-right-radius: 2px; }
    .msg-row.left .msg-bubble { background: #fff; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .msg-user { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #374151; }
    .sys-msg { text-align: center; font-size: 12px; color: #6b7280; margin: 8px 0; }
    .sys-msg.error { color: #dc2626; }
    .sys-msg.success { color: #16a34a; }
    .input-area { padding: 12px 16px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; align-items: center; }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-send { background: #22c55e; color: #fff; font-weight: 500; }
    .status-bar { padding: 4px 16px; background: #f3f4f6; font-size: 10px; color: #6b7280; text-align: center; }
    .send-status { transition: all 0.2s; }
    .send-status:hover { text-decoration: underline; }
    
    /* 大屏输入框优化 */
    @media (min-width: 768px) {
      .input-area { padding: 16px 20px; gap: 12px; background: #fff; }
      .input-area input[type="text"] { 
        padding: 16px 20px; 
        font-size: 15px;
        border-radius: 10px;
        height: 52px;
        transition: all 0.2s ease;
      }
      .input-area input[type="text"]:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }
      .btn { padding: 16px 32px; font-size: 15px; border-radius: 10px; height: 52px; }
      .msg-bubble { padding: 12px 16px; font-size: 15px; max-width: 70%; }
      .msg-box { padding: 24px; gap: 16px; }
      .chat-header { padding: 16px 24px; }
      .chat-header h1 { font-size: 18px; }
    }
    
    /* 邀请模态框 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 24px; width: 90%; max-width: 360px; }
    .modal h2 { font-size: 18px; margin-bottom: 16px; color: #1f2937; }
    .modal p { font-size: 14px; color: #6b7280; margin-bottom: 16px; }
    .invite-link { width: 100%; padding: 12px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 12px; color: #1f2937; margin-bottom: 16px; word-break: break-all; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .modal-btn-primary { background: #2563eb; color: #fff; }
    .modal-btn-secondary { background: #e5e7eb; color: #374151; }
    
    /* 表情面板 */
    .emoji-panel {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      margin-bottom: 8px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      padding: 12px;
      width: 320px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 40;
    }
    .emoji-panel.active { display: block; }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
    }
    .emoji-item {
      font-size: 22px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      text-align: center;
      transition: background 0.15s;
    }
    .emoji-item:hover { background: #f3f4f6; }
    
    /* 输入工具栏 */
    .input-toolbar { display: flex; gap: 4px; align-items: center; }
    .tool-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .tool-btn:hover { background: #f3f4f6; }
    
    /* 图片消息样式 */
    .msg-img { max-width: 240px; max-height: 240px; border-radius: 8px; cursor: pointer; margin-top: 4px; display: block; }
    .msg-file {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #f3f4f6;
      border-radius: 8px;
      margin-top: 4px;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
      color: #1f2937;
    }
    .msg-file:hover { background: #e5e7eb; }
    .msg-file-icon { font-size: 28px; }
    .msg-file-info { flex: 1; min-width: 0; }
    .msg-file-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msg-file-size { font-size: 12px; color: #6b7280; }
    
    /* 通知开关 */
    .sound-toggle {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .sound-toggle:hover { background: rgba(255,255,255,0.3); }
    
    /* 管理员标识 */
    .admin-badge {
      display: inline-block;
      background: #f59e0b;
      color: #fff;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<!-- 登录/注册页面 -->
<div id="loginPage" class="page active">
  <div class="auth-container">
    <div class="auth-title">📩 内部聊天系统</div>
    <div class="auth-subtitle">登录或注册开始聊天</div>
    
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuthTab('login')">登录</div>
      <div class="auth-tab" onclick="switchAuthTab('register')">注册</div>
    </div>
    
    <div id="authError" class="auth-error" style="display:none;"></div>
    <div id="syncStatus" class="auth-subtitle" style="font-size:12px;color:#9ca3af;text-align:center;margin-bottom:12px;">正在同步用户数据...</div>
    
    <div id="loginForm">
      <input type="text" class="auth-input" id="loginUsername" placeholder="用户名" />
      <input type="password" class="auth-input" id="loginPassword" placeholder="密码" />
      <button class="auth-btn" onclick="login()">登录</button>
    </div>
    
    <div id="registerForm" style="display:none;">
      <input type="text" class="auth-input" id="registerUsername" placeholder="设置用户名" />
      <input type="password" class="auth-input" id="registerPassword" placeholder="设置密码" />
      <input type="password" class="auth-input" id="registerConfirmPassword" placeholder="确认密码" />
      <button class="auth-btn" onclick="register()">注册</button>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div id="mainPage" class="page">
  <div class="main-container">
    <div class="main-header">
      <h1>💬 聊天室</h1>
      <div class="user-info">
        <button class="logout-btn" onclick="showDevModal()" title="开发者设置">🔧</button>
        <div class="user-avatar" id="userAvatar"></div>
        <button class="logout-btn" onclick="logout()">退出</button>
      </div>
    </div>
    
    <div class="room-create">
      <div class="room-create-form">
        <input type="text" id="newRoomName" placeholder="输入聊天室名称" />
        <button onclick="createRoom()">创建</button>
      </div>
    </div>
    
    <div class="room-list" id="roomList"></div>
  </div>
</div>

<!-- 聊天室页面 -->
<div id="chatPage" class="page">
  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-header-left">
        <button class="back-btn" onclick="backToMain()">← 返回</button>
        <h1 id="chatRoomName">聊天室</h1>
      </div>
      <div class="chat-actions">
        <div class="online-count" id="onlineCount">
          <span id="online">1</span> 在线 <span class="divider">|</span> <span id="totalUsers">1</span> 人
          <div class="user-list-popup" id="userListPopup">
            <div class="user-list-header">
              <span>聊天室成员</span>
              <span class="count"><span id="popupOnline">1</span> 在线 / <span id="popupTotal">1</span> 总计</span>
            </div>
            <div class="user-list-section online">在线用户</div>
            <div id="onlineUserList"></div>
            <div class="user-list-section all">全部成员</div>
            <div id="allUserList"></div>
          </div>
        </div>
        <button class="sound-toggle" id="soundToggle" onclick="toggleSound()" title="消息声音通知">🔔</button>
        <button class="sound-toggle" onclick="showAdminModal()" title="管理员设置">🔒</button>
        <button class="invite-btn" onclick="showInviteModal()">邀请</button>
      </div>
    </div>
    
    <div id="msgBox" class="msg-box"></div>
    <div class="status-bar" id="statusBar">正在连接...</div>
    <div class="input-area" style="position:relative;">
      <div class="input-toolbar">
        <button class="tool-btn" onclick="toggleEmojiPanel()" title="表情">😊</button>
        <button class="tool-btn" onclick="document.getElementById('fileInput').click()" title="发送图片/文件">📎</button>
      </div>
      <input id="msg" type="text" placeholder="输入消息..." style="flex:1;" />
      <button class="btn btn-send" onclick="send()">发送</button>
      <div class="emoji-panel" id="emojiPanel"></div>
      <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)" />
    </div>
  </div>
</div>

<!-- 邀请模态框 -->
<div class="modal-overlay" id="inviteModal">
  <div class="modal">
    <h2>邀请好友加入</h2>
    <p>分享下面的链接给朋友，他们点击即可加入聊天室：</p>
    <input type="text" class="invite-link" id="inviteLink" readonly />
    <div class="modal-actions">
      <button class="modal-btn modal-btn-secondary" onclick="closeInviteModal()">关闭</button>
      <button class="modal-btn modal-btn-primary" onclick="copyInviteLink()">复制链接</button>
    </div>
  </div>
</div>

<!-- 开发者模态框 -->
<div class="modal-overlay" id="devModal">
  <div class="modal">
    <h2>🔧 开发者面板</h2>
    <div id="devLoginSection">
      <p>输入开发者密码以执行全局操作：</p>
      <input type="password" class="auth-input" id="devPasswordInput" placeholder="开发者密码" />
      <div id="devError" class="auth-error" style="display:none;"></div>
      <div class="modal-actions" style="margin-top:12px;">
        <button class="modal-btn modal-btn-secondary" onclick="closeDevModal()">取消</button>
        <button class="modal-btn modal-btn-primary" onclick="devLogin()">验证</button>
      </div>
    </div>
    <div id="devPanelSection" style="display:none;">

<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<script>
// 公共 MQTT Broker
const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';

// 状态
let currentUser = null;
let client = null;
let currentRoomId = null;
let currentRoomName = null;
let onlineUsers = new Map();
let totalUsers = new Map(); // 累计用户: id -> user info
let currentClientId = null;
let pendingMsgs = {};
let processedMsgIds = new Set();  // 已处理过的消息 ID，防止超时后延迟到达导致重复显示
let heartbeatTimer = null;
let timeoutTimer = null;
let reconnectAttempts = 0;
let soundEnabled = true;
let isAdmin = false;
let isDev = false;
let userSyncClient = null;  // 用户数据同步 MQTT 连接
let usersSynced = false;    // 用户数据是否已同步完成
let userSyncTimeout = null;
const ADMIN_DEFAULT_PASSWORD = 'admin123';
const DEV_PASSWORD = 'dev2024';  // 开发者密码
const EMOJIS = ['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','🙃','😉','😊','😇','🥰','😍','🤩','😘','😗','😚','😙','🥲','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','😐','😑','😶','😏','😒','🙄','😬','😮‍💨','🤥','😌','😔','😪','🤤','😴','😷','🤒','🤕','🤢','🤮','🥵','🥶','🥴','😵','🤯','🤠','🥳','😎','🤓','🧐','😕','😟','🙁','☹️','😮','😯','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😓','😩','😫','🥱','👍','👎','👌','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','✋','🤚','🖐️','🖖','👋','🤝','👏','🙌','👐','🤲','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','🎉','🎊','🎈','🎂','🎁','🔥','⭐','✨','💫','🌟','⚡','💥'];

// ==================== 用户数据同步 ====================

const USER_SYNC_TOPIC = 'chat_users';
const ROOM_SYNC_TOPIC = 'chat_rooms';

// SHA-256 密码哈希
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// 初始化用户数据同步连接
function initUserSync() {
  userSyncClient = mqtt.connect(BROKER_URL, {
    clientId: 'userSync_' + Math.random().toString(16).substr(2, 8),
    clean: true,
    connectTimeout: 5000,
    reconnectPeriod: 3000,
  });

  userSyncClient.on('connect', () => {
    console.log('[同步] MQTT 已连接');
    userSyncClient.subscribe([USER_SYNC_TOPIC + '/+', ROOM_SYNC_TOPIC + '/+'], (err) => {
      if (!err) {
        console.log('[同步] 订阅 chat_users/+ 和 chat_rooms/+ 成功');
        // 订阅成功后等待1.5秒接收retained messages，然后标记为已同步
        userSyncTimeout = setTimeout(() => {
          usersSynced = true;
          updateSyncStatus();
          console.log('[同步] 同步完成，当前本地用户:', Object.keys(JSON.parse(localStorage.getItem('chatUsers') || '{}')));
        }, 1500);
      } else {
        console.error('[同步] 订阅失败:', err);
        usersSynced = true;
        updateSyncStatus();
      }
    });
  });

  userSyncClient.on('error', (err) => {
    console.error('[用户同步] 连接错误:', err.message);
  });

  // 总超时：如果连接失败，5秒后也允许登录（用本地数据）
  setTimeout(() => {
    if (!usersSynced) {
      usersSynced = true;
      updateSyncStatus();
      console.log('[用户同步] 连接超时，使用本地数据');
    }
  }, 5000);

  userSyncClient.on('message', (topic, message) => {
    try {
      const msgStr = message.toString();

      // ========== 处理聊天室数据 (chat_rooms/{roomId}) ==========
      if (topic.startsWith(ROOM_SYNC_TOPIC + '/')) {
        const roomId = topic.split('/').pop();
        const rooms = JSON.parse(localStorage.getItem('chatRooms') || '[]');

        if (!msgStr) {
          // 空消息表示聊天室已删除
          console.log('[同步] 聊天室已删除:', roomId);
          const filtered = rooms.filter(r => r.id !== roomId);
          localStorage.setItem('chatRooms', JSON.stringify(filtered));
        } else {
          const roomData = JSON.parse(msgStr);
          if (roomData.id) {
            console.log('[同步] 收到聊天室数据:', roomData.name);
            const index = rooms.findIndex(r => r.id === roomData.id);
            if (index >= 0) {
              // 合并数据，保留本地可能有的额外字段
              rooms[index] = { ...rooms[index], ...roomData };
            } else {
              rooms.push(roomData);
            }
            localStorage.setItem('chatRooms', JSON.stringify(rooms));

            // 如果当前在聊天室，更新管理员状态
            if (currentRoomId === roomData.id && currentUser) {
              isAdmin = !!(roomData.creator === currentUser.username);
            }
          }
        }

        // 如果当前在主界面，刷新聊天室列表
        if (document.getElementById('mainPage').classList.contains('active')) {
          loadRooms();
        }
        return;
      }

      // ========== 处理用户数据 (chat_users/{username}) ==========
      const username = topic.split('/').pop();

      if (!msgStr) {
        // 空消息表示该用户已被删除
        console.log('[同步] 用户已删除:', username);
        const users = JSON.parse(localStorage.getItem('chatUsers') || '{}');
        if (users[username]) {
          delete users[username];
          localStorage.setItem('chatUsers', JSON.stringify(users));
        }
        return;
      }

      const userData = JSON.parse(msgStr);
      if (userData.username) {
        console.log('[同步] 收到用户数据:', userData.username);
        if (!usersSynced) {
          usersSynced = true;
          if (userSyncTimeout) clearTimeout(userSyncTimeout);
          updateSyncStatus();
        }
        const users = JSON.parse(localStorage.getItem('chatUsers') || '{}');
        users[userData.username] = userData;
        localStorage.setItem('chatUsers', JSON.stringify(users));
      }
    } catch (e) {
      console.error('[同步] 解析错误:', e);
    }
  });
}

// 发布用户数据到 MQTT（同步到所有设备）
async function publishUser(username, password) {
  const passwordHash = await hashPassword(password);
  const userData = {
    username: username,
    passwordHash: passwordHash,
    createdAt: new Date().toISOString()
  };
  const topic = USER_SYNC_TOPIC + '/' + username;
  console.log('[用户同步] 发布用户数据到:', topic, '连接状态:', userSyncClient && userSyncClient.connected);
  userSyncClient.publish(topic, JSON.stringify(userData), {
    qos: 0,
    retain: true
  });
  return userData;
}

// 发布聊天室数据到 MQTT（同步到所有设备）
function publishRoom(roomData) {
  const topic = ROOM_SYNC_TOPIC + '/' + roomData.id;
  console.log('[同步] 发布聊天室数据到:', topic, '连接状态:', userSyncClient && userSyncClient.connected);
  userSyncClient.publish(topic, JSON.stringify(roomData), {
    qos: 0,
    retain: true
  });
}

// 更新登录页面的同步状态提示
function updateSyncStatus() {
  const statusEl = document.getElementById('syncStatus');
  if (statusEl) {
    statusEl.textContent = '';
    statusEl.style.display = 'none';
  }
}

// 清除所有用户数据（正式发布前清除内测数据，需开发者权限）
function clearAllUsers() {
  if (!isDev) {
    alert('需要开发者权限');
    return;
  }
  if (!userSyncClient || !userSyncClient.connected) {
    alert('MQTT 未连接，请稍后再试');
    return;
  }
  if (!confirm('确定要清除所有用户数据吗？\n\n此操作会删除所有设备上的已注册用户账号，不可撤销！')) return;
  if (!confirm('再次确认：这将永久删除所有用户账号，所有设备都会同步清除。确定继续？')) return;

  const users = JSON.parse(localStorage.getItem('chatUsers') || '{}');
  const usernames = Object.keys(users);

  // 对每个用户发布空消息，清除 MQTT retained message
  usernames.forEach(username => {
    userSyncClient.publish(USER_SYNC_TOPIC + '/' + username, '', {
      qos: 0,
      retain: true
    });
  });

  // 清除本地用户数据
  localStorage.removeItem('chatUsers');

  alert(`已清除 ${usernames.length} 个用户数据。\n所有设备将在下次连接时同步清除。`);
  closeDevModal();
}

// 清除所有聊天室数据（需开发者权限）
function clearAllRooms() {
  if (!isDev) {
    alert('需要开发者权限');
    return;
  }
  if (!userSyncClient || !userSyncClient.connected) {
    alert('MQTT 未连接，请稍后再试');
    return;
  }
  if (!confirm('确定要清除所有聊天室数据吗？\n\n此操作会删除所有设备上的聊天室，不可撤销！')) return;

  const rooms = JSON.parse(localStorage.getItem('chatRooms') || '[]');

  // 对每个聊天室发布空消息，清除 MQTT retained message
  rooms.forEach(room => {
    userSyncClient.publish(ROOM_SYNC_TOPIC + '/' + room.id, '', {
      qos: 0,
      retain: true
    });
  });

  // 清除本地聊天室数据
  localStorage.removeItem('chatRooms');

  alert(`已清除 ${rooms.length} 个聊天室数据。\n所有设备将在下次连接时同步清除。`);
  closeDevModal();
}

// 删除单个聊天室（仅创建者可删除）
function deleteRoom(roomId) {
  if (!userSyncClient || !userSyncClient.connected) {
    alert('MQTT 未连接，请稍后再试');
    return;
  }

  const rooms = JSON.parse(localStorage.getItem('chatRooms') || '[]');
  const room = rooms.find(r => r.id === roomId);

  if (!room) {
    alert('聊天室不存在');
    return;
  }

  // 仅创建者或开发者可删除
  const isCreator = room.creator === currentUser.username;
  if (!isCreator && !isDev) {
    alert('只有聊天室创建者才能删除聊天室');
    return;
  }

  if (!confirm(`确定要删除聊天室「${room.name}」吗？\n此操作不可撤销，所有设备都会同步删除。`)) return;

  // 发布空消息清除 MQTT retained message
  userSyncClient.publish(ROOM_SYNC_TOPIC + '/' + roomId, '', {
    qos: 0,
    retain: true
  });

  // 删除本地数据
  const filtered = rooms.filter(r => r.id !== roomId);
  localStorage.setItem('chatRooms', JSON.stringify(filtered));

  // 清除该聊天室的累计用户列表
  localStorage.removeItem('roomTotalUsers_' + roomId);

  // 如果当前在此聊天室中，返回主界面
  if (currentRoomId === roomId) {
    backToMain();
  } else {
    loadRooms();
  }

  alert('聊天室已删除');
}

// ==================== 认证功能 ====================

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  
  if (tab === 'login') {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
  } else {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
  }
  document.getElementById('authError').style.display = 'none';
}

function showAuthError(msg) {
  const errorEl = document.getElementById('authError');
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
}

async function register() {
  const username = document.getElementById('registerUsername').value.trim();
  const password = document.getElementById('registerPassword').value;
  const confirmPassword = document.getElementById('registerConfirmPassword').value;

  if (!username || !password) {
    showAuthError('请填写完整信息');
    return;
  }
  if (password !== confirmPassword) {
    showAuthError('两次输入的密码不一致');
    return;
  }

  // 等待用户数据同步完成，避免因同步延迟导致重复注册
  if (!usersSynced) {
    showAuthError('正在同步用户数据，请稍后再试...');
    return;
  }

  // 检查用户名是否已存在
  const users = JSON.parse(localStorage.getItem('chatUsers') || '{}');
  if (users[username]) {
    showAuthError('用户名已存在');
    return;
  }

  // 发布用户数据到 MQTT（同步到所有设备），密码用 SHA-256 哈希
  const userData = await publishUser(username, password);

  // 保存到本地
  users[username] = userData;
  localStorage.setItem('chatUsers', JSON.stringify(users));

  // 自动登录
  currentUser = { username: username };
  localStorage.setItem('currentUser', JSON.stringify(currentUser));
  handlePostLogin();
}

async function login() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!username || !password) {
    showAuthError('请填写用户名和密码');
    return;
  }

  // 等待用户数据同步完成
  if (!usersSynced) {
    showAuthError('正在同步用户数据，请稍后再试...');
    return;
  }

  const users = JSON.parse(localStorage.getItem('chatUsers') || '{}');
  if (!users[username]) {
    showAuthError('用户不存在，请先注册');
    return;
  }
  // 兼容新格式（passwordHash）和旧格式（明文 password）
  if (users[username].passwordHash) {
    const inputHash = await hashPassword(password);
    if (users[username].passwordHash !== inputHash) {
      showAuthError('密码错误');
      return;
    }
  } else if (users[username].password !== password) {
    showAuthError('密码错误');
    return;
  }

  currentUser = { username: username };
  localStorage.setItem('currentUser', JSON.stringify(currentUser));
  handlePostLogin();
}

// 登录后处理：检查邀请链接或进入主界面
function handlePostLogin() {
  // 检查是否有邀请链接
  const urlParams = new URLSearchParams(window.location.search);
  const roomId = urlParams.get('room');
  const roomName = urlParams.get('name');

  if (roomId && roomName) {
    // 检查聊天室是否已存在于本地
    const rooms = JSON.parse(localStorage.getItem('chatRooms') || '[]');
    if (!rooms.find(r => r.id === roomId)) {
      // 聊天室不在本地，先添加临时数据，creator 等 MQTT 同步真实值
      rooms.unshift({
        id: roomId,
        name: roomName,
        creator: '',
        createdAt: new Date().toISOString()
      });
      localStorage.setItem('chatRooms', JSON.stringify(rooms));
    }

    // 直接进入聊天室（urlParams.get 已自动解码，无需再 decodeURIComponent）
    showPage('mainPage');
    showChatPage(roomId, roomName);
  } else {
    showMainPage();
  }
}

function logout() {
  localStorage.removeItem('currentUser');
  currentUser = null;
  isAdmin = false;
  isDev = false;
  stopChatConnection();
  showLoginPage();
}

// ==================== 页面切换 ====================

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

function showLoginPage() {
  showPage('loginPage');
}

function showMainPage() {
  if (!currentUser) {
    showLoginPage();
    return;
  }
  // 更新用户头像
  const avatar = document.getElementById('userAvatar');
  avatar.textContent = currentUser.username.charAt(0).toUpperCase();

  // 加载聊天室列表
  loadRooms();
  showPage('mainPage');
}

function showChatPage(roomId, roomName) {
  currentRoomId = roomId;
  currentRoomName = roomName;
  document.getElementById('chatRoomName').textContent = roomName;
  document.getElementById('msgBox').innerHTML = '';

  // 判断当前用户是否是聊天室创建者（每室隔离）
  const rooms = JSON.parse(localStorage.getItem('chatRooms') || '[]');
  const room = rooms.find(r => r.id === roomId);
  isAdmin = !!(room && room.creator === currentUser.username);

  // 加载累计用户列表
  const savedTotal = JSON.parse(localStorage.getItem('roomTotalUsers_' + roomId) || '[]');
  totalUsers = new Map(savedTotal.map(u => [u.id, u]));

  showPage('chatPage');
  connectChat();
}

function backToMain() {
  stopChatConnection();
  isAdmin = false;
  showMainPage();
}

// ==================== 聊天室功能 ====================

function loadRooms() {
  const rooms = JSON.parse(localStorage.getItem('chatRooms') || '[]');
  const roomList = document.getElementById('roomList');
  
  if (rooms.length === 0) {
    roomList.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <div class="empty-state-text">还没有聊天室，创建一个吧！</div>
      </div>
    `;
    return;
  }
  
  roomList.innerHTML = rooms.map(room => {
    const canDelete = room.creator === currentUser.username || isDev;
    return `
    <div class="room-item" data-room-id="${escapeHtml(room.id)}" data-room-name="${escapeHtml(room.name)}">
      <div class="room-icon">💬</div>
      <div class="room-info">
        <div class="room-name">${escapeHtml(room.name)}</div>
        <div class="room-desc">创建者: ${escapeHtml(room.creator || '未知')}</div>
      </div>
      ${canDelete ? `<button class="room-delete-btn" data-delete-id="${escapeHtml(room.id)}" title="删除聊天室" style="background:#ef4444;color:#fff;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px;margin-left:8px;">✕</button>` : ''}
      <button class="room-join-btn">进入</button>
    </div>
    `;
  }).join('');

  // 事件委托：点击房间项进入聊天室（避免内联 onclick 导致的 XSS）
  roomList.querySelectorAll('.room-item').forEach(item => {
    item.addEventListener('click', function(e) {
      // 如果点击的是删除按钮，不进入聊天室
      if (e.target.classList.contains('room-delete-btn')) {
        e.stopPropagation();
        const roomId = e.target.getAttribute('data-delete-id');
        deleteRoom(roomId);
        return;
      }
      const roomId = this.getAttribute('data-room-id');
      const roomName = this.getAttribute('data-room-name');
      enterRoom(roomId, roomName);
    });
  });
}

function createRoom() {
  const roomName = document.getElementById('newRoomName').value.trim();
  if (!roomName) {
    alert('请输入聊天室名称');
    return;
  }

  const roomId = 'room_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
  const newRoom = {
    id: roomId,
    name: roomName,
    creator: currentUser.username,
    createdAt: new Date().toISOString()
  };
  const rooms = JSON.parse(localStorage.getItem('chatRooms') || '[]');
  rooms.unshift(newRoom);
  localStorage.setItem('chatRooms', JSON.stringify(rooms));

  // 发布到 MQTT，同步到所有设备
  publishRoom(newRoom);

  document.getElementById('newRoomName').value = '';
  loadRooms();

  // 直接进入新创建的聊天室
  enterRoom(roomId, roomName);
}

function enterRoom(roomId, roomName) {

// ==================== MQTT 聊天功能 ====================

function getTopics() {
  return {
    chat: `${currentRoomId}/message`,
    heartbeat: `${currentRoomId}/heartbeat`
  };
}

function connectChat() {
  stopChatConnection();
  
  const topics = getTopics();
  updateStatus('连接中...');
  const clientId = 'chat_' + Math.random().toString(16).substr(2, 8);
  currentClientId = clientId;
  
  client = mqtt.connect(BROKER_URL, {
    clientId: clientId,
    clean: true,
    connectTimeout: 5000,
    reconnectPeriod: 3000,
  });
  
  client.on('connect', () => {
    sysMsg('已连接到聊天服务器', 'success');
    updateStatus('已连接', 'success');
    reconnectAttempts = 0;
    
    client.subscribe([topics.chat, topics.heartbeat], (err) => {
      if (err) {
        sysMsg('订阅失败: ' + err.message, 'error');
      } else {
        initHeartbeat(clientId, topics);
      }
    });
  });
  
  client.on('message', (topic, message) => {
    try {
      const data = JSON.parse(message.toString());
      
      if (topic === topics.chat) {
        // 系统消息直接显示
        if (data.type === 'system') {
          sysMsg(data.msg, 'success');
          return;
        }
        // 已处理过的消息不再显示（防止超时后延迟到达导致重复）
        if (processedMsgIds.has(data.msgId)) {
          return;
        }
        processedMsgIds.add(data.msgId);
        // 限制 Set 大小，防止内存无限增长
        if (processedMsgIds.size > 500) {
          const firstId = processedMsgIds.values().next().value;
          processedMsgIds.delete(firstId);
        }
        if (pendingMsgs[data.msgId]) {
          const pending = pendingMsgs[data.msgId];
          clearTimeout(pending.timeoutId);
          if (pending.element) {
            const status = pending.element.querySelector('.send-status');
            if (status) status.remove();
          }
          delete pendingMsgs[data.msgId];
          return;
        }
        showMsg(data);
      } else if (topic === topics.heartbeat) {
        // 处理被踢出
        if (data.type === 'kick' && data.target === currentUser.username) {
          sysMsg('您已被管理员移出聊天室', 'error');
          setTimeout(() => backToMain(), 2000);
          return;
        }
        handleHeartbeat(data, clientId, topics);
      }
    } catch (e) {
      console.error('Parse error:', e);
    }
  });
  
  client.on('error', (err) => {
    sysMsg('连接错误: ' + err.message, 'error');
    updateStatus('连接错误', 'error');
  });
  
  client.on('close', () => {
    updateStatus('连接断开，重连中...');
    reconnectAttempts++;
  });
  
  client.on('reconnect', () => {
    updateStatus('重新连接中...');
  });
}

function stopChatConnection() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  if (timeoutTimer) clearInterval(timeoutTimer);
  if (client) {
    client.end(true);
    client = null;
  }
  // 保存累计用户列表到 localStorage
  if (currentRoomId) {
    const totalArray = Array.from(totalUsers.values());
    localStorage.setItem('roomTotalUsers_' + currentRoomId, JSON.stringify(totalArray));
  }
  onlineUsers.clear();
  currentClientId = null;
  pendingMsgs = {};
  processedMsgIds.clear();
}

function initHeartbeat(clientId, topics) {
  // 清理旧的定时器（防止 MQTT 自动重连时创建重复定时器）
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  if (timeoutTimer) clearInterval(timeoutTimer);

  onlineUsers.set(clientId, { user: currentUser.username, lastSeen: Date.now() });
  // 添加到累计用户列表
  if (!totalUsers.has(clientId)) {
    totalUsers.set(clientId, { id: clientId, user: currentUser.username, firstSeen: Date.now() });
  }
  updateOnlineCount();
  
  client.publish(topics.heartbeat, JSON.stringify({ 
    type: 'hello', id: clientId, user: currentUser.username 
  }));
  
  heartbeatTimer = setInterval(() => {
    client.publish(topics.heartbeat, JSON.stringify({ 
      type: 'heartbeat', id: clientId, user: currentUser.username, timestamp: Date.now() 
    }));
  }, 5000);
  
  timeoutTimer = setInterval(() => {
    const now = Date.now();
    let changed = false;
    for (const [id, info] of onlineUsers) {
      if (id !== clientId && now - info.lastSeen > 30000) {
        onlineUsers.delete(id);
        changed = true;
      }
    }
    if (changed) updateOnlineCount();
  }, 10000);
}

function handleHeartbeat(data, clientId, topics) {
  const now = Date.now();
  
  if (data.type === 'hello' && data.id !== clientId) {
    onlineUsers.set(data.id, { user: data.user, lastSeen: now });
    // 添加到累计用户列表
    if (!totalUsers.has(data.id)) {
      totalUsers.set(data.id, { id: data.id, user: data.user, firstSeen: now });
    }
    updateOnlineCount();
    sysMsg(data.user + ' 加入了聊天室', 'success');
    
    client.publish(topics.heartbeat, JSON.stringify({ 
      type: 'heartbeat', id: clientId, user: currentUser.username, timestamp: now 
    }));
  } else if (data.type === 'heartbeat' && data.id !== clientId) {
    onlineUsers.set(data.id, { user: data.user, lastSeen: now });
    // 添加到累计用户列表（以防错过hello消息）
    if (!totalUsers.has(data.id)) {
      totalUsers.set(data.id, { id: data.id, user: data.user, firstSeen: now });
    }
    updateOnlineCount();
  } else if (data.type === 'bye' && data.id !== clientId && onlineUsers.has(data.id)) {
    const user = onlineUsers.get(data.id).user;
    onlineUsers.delete(data.id);
    updateOnlineCount();
    sysMsg(user + ' 离开了聊天室');
  }
}

function updateOnlineCount() {
  document.getElementById('online').textContent = onlineUsers.size;
  document.getElementById('totalUsers').textContent = totalUsers.size;
  renderUserList();
}

function renderUserList() {

}

function updateStatus(text, type) {
  const bar = document.getElementById('statusBar');
  bar.textContent = text;
  bar.className = 'status-bar';

  else if (type === 'error') bar.style.color = '#dc2626';
}

function send() {
  const msg = document.getElementById('msg').value.trim();
  if (!msg) return;
  if (!client || !client.connected) {
    sysMsg('未连接，请等待重新连接', 'error');
    return;
  }
  
  const topics = getTopics();
  const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  const message = {
    user: currentUser.username,
    msg: msg,
    time: getTimeStr(),
    msgId: msgId,
    isAdmin: isAdmin
  };
  
  const msgElement = showMsg(message);
  
  const statusDiv = document.createElement('div');
  statusDiv.className = 'send-status';
  statusDiv.textContent = '发送中...';
  statusDiv.style.cssText = 'font-size:11px;color:#9ca3af;margin-top:2px;';
  msgElement.appendChild(statusDiv);
  
  client.publish(topics.chat, JSON.stringify(message));
  document.getElementById('msg').value = '';
  
  const timeoutId = setTimeout(() => {
    if (pendingMsgs[msgId]) {
      const pending = pendingMsgs[msgId];
      const status = pending.element.querySelector('.send-status');
      if (status) {
        status.textContent = '❌ 发送失败，点击重试';
        status.style.color = '#dc2626';
        status.style.cursor = 'pointer';
        status.onclick = () => retryMsg(msgId);
      }
      delete pendingMsgs[msgId];
    }
  }, 3000);
  
  pendingMsgs[msgId] = { msg: message, timeoutId: timeoutId, element: msgElement };
}

function retryMsg(msgId) {
  const pending = pendingMsgs[msgId];
  if (!pending) return;

  const topics = getTopics();
  const newMsgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  const message = {
    user: currentUser.username,
    msg: pending.msg.msg,
    time: getTimeStr(),
    msgId: newMsgId,
    isAdmin: isAdmin
  };
  
  client.publish(topics.chat, JSON.stringify(message));
  
  const timeoutId = setTimeout(() => {
    if (pendingMsgs[newMsgId]) {
      const p = pendingMsgs[newMsgId];
      const s = p.element.querySelector('.send-status');
      if (s) {
        s.textContent = '❌ 发送失败，点击重试';
        s.style.color = '#dc2626';
        s.style.cursor = 'pointer';
        s.onclick = () => retryMsg(newMsgId);
      }
      delete pendingMsgs[newMsgId];
    }
  }, 3000);
  
  pendingMsgs[newMsgId] = { msg: message, timeoutId: timeoutId, element: pending.element };
}

function showMsg(data) {
  const isMe = data.user === currentUser.username;
  const div = document.createElement('div');
  div.className = 'msg-row ' + (isMe ? 'right' : 'left');

  const safeUser = escapeHtml(data.user);
  const safeTime = escapeHtml(data.time || '');
  const adminTag = data.isAdmin ? '<span class="admin-badge">管理员</span>' : '';

  let contentHtml = '';
  if (data.type === 'image') {
    // 使用 data 属性 + 事件监听，避免 XSS；校验 URL 必须是 http(s) 或 data 协议
    const rawUrl = String(data.msg || '');
    if (/^(https?:|data:image)/i.test(rawUrl)) {
      contentHtml = `<img class="msg-img" src="${escapeHtml(rawUrl)}" data-preview-url="${escapeHtml(rawUrl)}" />`;
    } else {
      contentHtml = `<div>[不支持的图片链接]</div>`;
    }
  } else if (data.type === 'file') {
    const safeName = escapeHtml(data.fileName || '文件');
    const safeSize = escapeHtml(data.fileSize || '');
    const rawUrl = String(data.msg || '');
    // 只允许 http(s) 协议的文件链接，防止 javascript: 协议 XSS
    if (/^https?:/i.test(rawUrl)) {
      contentHtml = `<a class="msg-file" href="${escapeHtml(rawUrl)}" download="${safeName}" target="_blank" rel="noopener noreferrer">
        <div class="msg-file-icon">📎</div>
        <div class="msg-file-info">
          <div class="msg-file-name">${safeName}</div>
          <div class="msg-file-size">${safeSize}</div>
        </div>
      </a>`;
    } else {
      contentHtml = `<div>📎 ${safeName} (${safeSize}) [不支持的文件链接]</div>`;
    }
  } else {
    contentHtml = `<div>${escapeHtml(data.msg)}</div>`;
  }

  div.innerHTML = `<div class="msg-bubble"><div class="msg-user">${safeUser}${adminTag} ${safeTime}</div>${contentHtml}</div>`;

  // 图片点击预览（事件监听而非内联 onclick，避免 XSS）
  const imgEl = div.querySelector('.msg-img');
  if (imgEl) {
    imgEl.addEventListener('click', function() {
      const url = this.getAttribute('data-preview-url');
      if (url) previewImage(url);
    });
  }

  document.getElementById('msgBox').appendChild(div);
  document.getElementById('msgBox').scrollTop = document.getElementById('msgBox').scrollHeight;

  // 收到他人消息时播放通知音
  if (!isMe && soundEnabled) playNotifySound();

  return div;
}

function sysMsg(text, type) {
  const d = document.createElement('div');
  d.className = 'sys-msg' + (type ? ' ' + type : '');
  d.textContent = text;
  document.getElementById('msgBox').appendChild(d);
  document.getElementById('msgBox').scrollTop = document.getElementById('msgBox').scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

// 转义字符串用于 JS 字符串上下文（防止单引号/反斜杠/换行破坏字符串）
function escapeJsString(text) {
  if (text == null) return '';
  return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
}

function getTimeStr() {
  const d = new Date();
  const y = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const da = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  const s = String(d.getSeconds()).padStart(2, '0');
  return `${y}-${mo}-${da} ${h}:${mi}:${s}`;
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  if (!client || !client.connected) {
    sysMsg('未连接，请等待重新连接', 'error');
    return;
  }
  
  // 限制文件大小 2MB（MQTT消息限制）
  if (file.size > 2 * 1024 * 1024) {
    sysMsg('文件过大，请选择小于2MB的文件', 'error');
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const base64 = e.target.result;
    const topics = getTopics();
    const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
    const isImage = file.type.startsWith('image/');
    
    const message = {
      user: currentUser.username,
      msg: base64,
      time: getTimeStr(),
      msgId: msgId,
      type: isImage ? 'image' : 'file',
      fileName: file.name,
      fileSize: formatFileSize(file.size),
      isAdmin: isAdmin
    };
    
    const msgElement = showMsg(message);
    
    const statusDiv = document.createElement('div');
    statusDiv.className = 'send-status';
    statusDiv.textContent = '发送中...';
    statusDiv.style.cssText = 'font-size:11px;color:#9ca3af;margin-top:2px;';
    msgElement.appendChild(statusDiv);
    
    client.publish(topics.chat, JSON.stringify(message));
    
    const timeoutId = setTimeout(() => {
      if (pendingMsgs[msgId]) {
        const pending = pendingMsgs[msgId];
        const status = pending.element.querySelector('.send-status');
        if (status) {
          status.textContent = '❌ 发送失败，点击重试';
          status.style.color = '#dc2626';
          status.style.cursor = 'pointer';
          status.onclick = () => retryFileMsg(msgId, message);
        }
        delete pendingMsgs[msgId];
      }
    }, 5000);
    
    pendingMsgs[msgId] = { msg: message, timeoutId: timeoutId, element: msgElement };
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function retryFileMsg(msgId, originalMessage) {
  if (!client || !client.connected) {
    sysMsg('未连接，请等待重新连接', 'error');
    return;
  }
  const topics = getTopics();
  const newMsgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  const message = { ...originalMessage, msgId: newMsgId, time: getTimeStr() };
  
  client.publish(topics.chat, JSON.stringify(message));
  
  const timeoutId = setTimeout(() => {
    if (pendingMsgs[newMsgId]) {
      const p = pendingMsgs[newMsgId];
      const s = p.element.querySelector('.send-status');
      if (s) {
        s.textContent = '❌ 发送失败，点击重试';
        s.style.color = '#dc2626';
        s.style.cursor = 'pointer';
        s.onclick = () => retryFileMsg(newMsgId, message);
      }
      delete pendingMsgs[newMsgId];
    }
  }, 5000);
  
  pendingMsgs[newMsgId] = { msg: message, timeoutId: timeoutId, element: pendingMsgs[msgId]?.element || null };
  delete pendingMsgs[msgId];
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// ==================== 消息通知声音 ====================

function playNotifySound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = ctx.createOscillator();
    const gainNode = ctx.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(ctx.destination);
    
    oscillator.frequency.setValueAtTime(800, ctx.currentTime);
    oscillator.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
    
    gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    
    oscillator.start(ctx.currentTime);
    oscillator.stop(ctx.currentTime + 0.3);
  } catch (e) {
    // 忽略音频错误
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundToggle').textContent = soundEnabled ? '🔔' : '🔕';

    }
  });
  
  // 回车键发送消息
  document.getElementById('msg').addEventListener('keydown', e => {
    if (e.key === 'Enter') send();
  });
  
  // 关闭页面时清理
  window.addEventListener('beforeunload', () => {
    if (client && client.connected) {
      client.publish(getTopics().heartbeat, JSON.stringify({ type: 'bye', id: currentClientId }));
      client.end();
    }
    if (userSyncClient) {
      userSyncClient.end(true);
    }
  });
};
</script>
</body>
</html>
